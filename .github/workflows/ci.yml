name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # Installed from pyproject.toml so CI and a local venv share one
      # dependency list.  Airflow goes in first under its own constraint file
      # (pip cannot resolve apache-airflow reliably without it); the project
      # install then applies our pins, which deliberately differ from the
      # constraints for duckdb, pyarrow and ruff.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "apache-airflow==2.10.5" \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-2.10.5/constraints-3.12.txt"
          pip install -e ".[dev,cloud]"

      - name: Lint
        run: |
          ruff check src/ dags/ tests/
          ruff format --check src/ dags/ tests/

      - name: Test
        run: pytest
