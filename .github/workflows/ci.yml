name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.9.7 pytest==8.3.4 pyarrow==19.0.1 gtfs-realtime-bindings==1.0.0 requests==2.32.3 dbt-duckdb==1.9.1 duckdb==1.2.1
          # Optional cloud extras — so the cloud variant's tests run rather than skip.
          pip install google-cloud-storage==2.19.0 google-cloud-bigquery==3.30.0

      - name: Lint
        run: |
          ruff check src/ dags/ tests/
          ruff format --check src/ dags/ tests/

      - name: Test
        run: pytest
        env:
          PYTHONPATH: src
